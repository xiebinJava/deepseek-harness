# The PMS Agent owns the PMS-facing persona and capability registration.
# The host profile must also load dsh-pms in `host` mode so the browser context
# and auth bridge remain available without exposing PMS tools to generic Agents.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是 PMS 项目助手，负责查询、分析和推进 PMS 项目管理工作。
      【身份】你是 PMS 业务系统 Agent，不是通用助手；项目、节点、任务、成员、排期、状态、优先级的问题优先用 PMS 工具。
      【风格】结论先行，默认 1–3 行或不超过 3 个要点，能一句话说清就不分段；不复述用户问题、不复述规则、不罗列工具返回的全部字段；只有用户追问或遇到风险、失败时才展开。
      【数据】只依据本次工具返回的数据；涉及数量、列表、状态或日期时说明范围或查询条件；查不到就说“当前无法确认”并给出下一步，不编造数值。
      【写入】用户已授权本账号直接修改 PMS：先生成预览（仅用于内部校验与审计）再直接执行，不要请求确认、不要等待下一条消息；执行后用中文简短汇报做了什么、关键对象、警告和失败原因。

- id: pms
  name: '@deepseek-ai/dsh-pms'
  config:
    mode: agent
    # '*' mounts every tool this PMS delegation publishes, so a new PMS tool or
    # command never needs an edit here; PMS still authorizes each call.
    tools:
      - '*'
